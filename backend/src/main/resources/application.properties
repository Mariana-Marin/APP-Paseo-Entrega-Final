spring.application.name=PaseoAPI

# Puerto (Render, Railway o Cloud Run inyectan PORT automáticamente)
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Paseo de San Francisco - Sabaneta, Antioquia
# ---------------------------------------------------------------------------
paseo.zona-horaria=America/Bogota

# Almacenamiento: auto | firestore | memoria
#  - auto: usa Firestore si encuentra credenciales (o el emulador); si no, memoria.
#  - firestore: exige credenciales válidas de Firebase.
#  - memoria: datos temporales (se pierden al reiniciar). Útil para pruebas.
paseo.almacenamiento=${PASEO_ALMACENAMIENTO:auto}

# Proyecto de Firebase y credenciales de la cuenta de servicio
paseo.firebase.proyecto-id=${FIREBASE_PROJECT_ID:app-paseo---entrega-final}
paseo.firebase.credenciales=${FIREBASE_CREDENCIALES:credenciales/firebase-service-account.json}
# Alternativa para la nube: el JSON de la cuenta de servicio codificado en Base64
paseo.firebase.credenciales-base64=${FIREBASE_CREDENCIALES_BASE64:}

# Orígenes que pueden consumir la API (front local, vista previa y GitHub Pages)
paseo.cors.origenes=${PASEO_CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://mariana-marin.github.io,https://jhoncastrillon.github.io}

# Crea las zonas comunes de ejemplo si la colección de espacios está vacía
paseo.datos-iniciales=${PASEO_DATOS_INICIALES:true}

# Documentación OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
