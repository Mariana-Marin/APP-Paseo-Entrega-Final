name: Desplegar frontend en GitHub Pages

# Publica el frontend (carpeta frontend/) en GitHub Pages en cada push a main.
# La base del sitio se ajusta automáticamente al nombre del repositorio, de modo
# que funciona tanto en Mariana-Marin/... como en cualquier fork.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Construir el sitio
        working-directory: frontend
        env:
          # La base debe ser /<nombre-del-repo>/ para GitHub Pages de proyecto.
          VITE_BASE: /${{ github.event.repository.name }}/
          # URL del backend desplegado (defínela en Settings > Secrets and variables
          # > Actions > Variables como VITE_API_URL). Si no existe, usa localhost.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Configuración de Firebase (Settings > Secrets > Actions). Opcional:
          # si no se definen, la app funciona solo contra el backend.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm run build
          # Fallback SPA: GitHub Pages sirve 404.html en rutas desconocidas,
          # así los enlaces profundos (/reservas, /panel...) cargan la app.
          cp dist/index.html dist/404.html

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
